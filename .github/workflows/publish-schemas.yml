name: Publish FS25 Schemas

on:
  push:
    paths:
      - 'MGS-FS25-Schemas.zip'
      - '.github/workflows/publish-schemas.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Verify uploaded package
        shell: bash
        run: |
          test -f MGS-FS25-Schemas.zip
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('MGS-FS25-Schemas.zip') as z:
              names = set(z.namelist())
              required = {'dist/fs25/vehicle.xsd', 'upstream/giants/vehicle.xsd', 'scripts/build.py'}
              assert required <= names, f'Missing: {required - names}'
              for item in z.infolist():
                  path = item.filename.replace('\\', '/')
                  assert not path.startswith('/') and '..' not in path.split('/'), f'Unsafe ZIP path: {path}'
          PY
      - name: Extract schema package
        run: unzip -oq MGS-FS25-Schemas.zip
      - name: Validate XSD files
        run: |
          python -m pip install lxml
          python - <<'PY'
          from lxml import etree
          from pathlib import Path
          files = list(Path('dist/fs25').glob('*.xsd'))
          assert files and Path('dist/fs25/vehicle.xsd').exists()
          for f in files:
              etree.XMLSchema(etree.parse(str(f)))
          print(f'Validated {len(files)} XSD files')
          PY
      - name: Commit schema files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/fs25 upstream/giants scripts/build.py snippets/fs25.code-snippets extensions/interactive-control-reference.md
          if ! git diff --cached --quiet; then
            git commit -m "build: publish validated FS25 schema collection"
            git push
          fi
